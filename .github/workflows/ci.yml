name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # the vulnerability DB changes daily; re-scan an unchanged tree weekly
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build -trimpath ./...

      - name: test (race)
        run: go test -race ./...

      - name: govulncheck
        # pinned for reproducibility; the vuln DB itself updates server-side
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
