name: release

# Publishes a release for every three-component tag (v1.2.3).
#
# This file runs unchanged on github.com and on Forgejo/Gitea. Nothing in it is
# forge-specific and nothing is branched per forge:
#
#   * API base     - ${{ github.api_url }}: https://api.github.com on GitHub,
#                    https://<host>/api/v1 on Forgejo. Both serve
#                    /repos/{owner}/{repo}/releases.
#   * auth         - "Authorization: token ..." is accepted by both.
#   * asset upload - the upload_url returned by the create-release call (GitHub
#                    points it at uploads.github.com, Forgejo at its own host),
#                    with the raw binary as the request body. GitHub documents
#                    raw binary for this endpoint; Forgejo accepts it too.
#
# Deliberately no third-party actions: the Forgejo runner resolves actions from
# data.forgejo.org, which does not mirror softprops/action-gh-release, and it
# pre-fetches every action before running a single step, so an unmirrored action
# fails the job before the build starts. actions/upload-artifact@v4 is also
# unusable there (@actions/artifact reports GHESNotSupportedError).
#
# Re-running this workflow for a tag whose release already exists will fail on
# asset upload (both forges reject a duplicate filename). Delete the release
# first if you need to rebuild one.

on:
  push:
    tags:
      # three-component semver only: upstream ships 1.0 / 1.1 / v1.2 tags that
      # must NOT build releases (they point at pre-fix commits)
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/nssc-linux-$arch" ./cmd/nssc
          done
          ./dist/nssc-linux-amd64 version
          test "$(./dist/nssc-linux-amd64 version)" = "${GITHUB_REF_NAME}"
          ( cd dist && sha256sum nssc-linux-* > SHA256SUMS )
          ls -l dist

      - name: publish
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
        run: |
          set -eu
          base="$API/repos/${{ github.repository }}"
          tag="$GITHUB_REF_NAME"
          auth="Authorization: token ${TOKEN}"

          payload=$(printf '{"tag_name":"%s","name":"%s","body":"Release %s"}' \
                    "$tag" "$tag" "$tag")

          code=$(curl -sS -o rel.json -w '%{http_code}' -X POST "$base/releases" \
                   -H "$auth" -H 'Content-Type: application/json' -d "$payload")
          case "$code" in
            2*) resp=$(cat rel.json); echo "created release $tag" ;;
            409|422)
              if resp=$(curl -fsS "$base/releases/tags/$tag" -H "$auth" 2>/dev/null); then
                echo "release $tag already exists, reusing it"
              else
                echo "creating release failed: HTTP $code"; cat rel.json; exit 1
              fi ;;
            *) echo "creating release failed: HTTP $code"; cat rel.json; exit 1 ;;
          esac

          # upload_url comes from the API, so the host is never hardcoded.
          # GitHub pretty-prints its JSON ("upload_url": "https://...") while
          # Forgejo emits it compact ("upload_url":"https://..."), so allow any
          # whitespace around the colon. GitHub also appends an RFC 6570
          # template (.../assets{?name,label}); strip it.
          up=$(printf '%s' "$resp" \
                 | grep -oE '"upload_url"[[:space:]]*:[[:space:]]*"[^"]*"' \
                 | head -1 | sed -E 's/^.*"([^"]*)"$/\1/')
          up=${up%%\{*}
          if [ -z "$up" ]; then
            echo "could not find upload_url in the API response:" >&2
            printf '%s\n' "$resp" >&2
            exit 1
          fi

          for f in dist/*; do
            name=$(basename "$f")
            code=$(curl -sS -o up.json -w '%{http_code}' -X POST "$up?name=$name" \
                     -H "$auth" -H 'Content-Type: application/octet-stream' \
                     --data-binary "@$f")
            case "$code" in
              2*) echo "uploaded $name" ;;
              *)  echo "uploading $name failed: HTTP $code"; cat up.json; exit 1 ;;
            esac
          done
          echo "release $tag published"
