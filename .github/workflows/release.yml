name: release

on:
  push:
    tags:
      # three-component semver only: upstream ships 1.0 / 1.1 / v1.2 tags that
      # must NOT build releases (they point at pre-fix commits)
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # single job, no upload/download-artifact: @actions/artifact v4 is not
      # supported by this Forgejo (reports GHESNotSupportedError)
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/nssc-linux-$arch" ./cmd/nssc
          done
          ./dist/nssc-linux-amd64 version
          test "$(./dist/nssc-linux-amd64 version)" = "${GITHUB_REF_NAME}"
          ( cd dist && sha256sum nssc-linux-* > SHA256SUMS )
          ls -l dist

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nssc-linux-amd64
            dist/nssc-linux-arm64
            dist/SHA256SUMS
