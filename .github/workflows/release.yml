name: release

on:
  push:
    tags:
      # three-component semver only: upstream ships 1.0 / 1.1 / v1.2 tags that
      # must NOT build releases (they point at pre-fix commits)
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # single job, no upload/download-artifact: @actions/artifact v4 is not
      # supported by this Forgejo (reports GHESNotSupportedError)
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/nssc-linux-$arch" ./cmd/nssc
          done
          ./dist/nssc-linux-amd64 version
          test "$(./dist/nssc-linux-amd64 version)" = "${GITHUB_REF_NAME}"
          ( cd dist && sha256sum nssc-linux-* > SHA256SUMS )
          ls -l dist

      # no third-party action: the runner resolves actions via data.forgejo.org,
      # which does not mirror softprops/action-gh-release ("remote: Not found"),
      # and it pre-fetches every action before running any step
      - name: create release
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: token ${TOKEN}"
          create() {
            curl -fsS -X POST "$api/releases" -H "$auth" \
              -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"${GITHUB_REF_NAME}\",\"name\":\"${GITHUB_REF_NAME}\",\"body\":\"Release ${GITHUB_REF_NAME}\"}"
          }
          resp=$(create) || resp=$(curl -fsS "$api/releases/tags/${GITHUB_REF_NAME}" -H "$auth")
          rid=$(printf '%s' "$resp" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          test -n "$rid"
          for f in dist/*; do
            curl -fsS -X POST "$api/releases/${rid}/assets?name=$(basename "$f")" \
              -H "$auth" -F "attachment=@${f}"
          done
          echo "release ${GITHUB_REF_NAME} id=${rid} published"
